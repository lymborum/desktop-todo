<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>手帐待办</title>
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 顶部拖拽条（胶带区域） -->
  <div class="dragbar"></div>

  <!-- 笔记本卡片 -->
  <div class="note" id="note">
    <span class="tape"></span>

    <div class="hd">
      <span class="date" id="dateStr"></span>
      <div class="hd-actions">
        <span class="warn" id="hdWarn"></span>
        <span class="pin" id="hdPin"></span>
        <button class="addbtn" id="addBtn" title="记一笔" style="-webkit-app-region:no-drag">＋</button>
        <button class="menu-btn" id="menuBtn" title="更多" style="-webkit-app-region:no-drag">⋯</button>
      </div>
    </div>

    <div class="addbox" id="addbox">
      <div class="addline">
        <span class="plus">＋</span>
        <input id="input" placeholder="写下任务，回车添加…" autocomplete="off">
      </div>
      <div class="chips">
        <span class="chip flag" data-prio="hi">⚑ 重要</span>
        <span class="chip" data-days="0">今天</span>
        <span class="chip" data-days="1">明天</span>
        <span class="chip" data-days="2">后天</span>
        <span class="chip" data-days="3">3天后</span>
        <span class="chip" data-days="7">一周后</span>
        <span class="chip" data-recur="daily">每天</span>
        <span class="chip" data-recur="weekly">每周</span>
        <span class="chip" id="chipCal">选日期</span>
      </div>
    </div>

    <!-- 自定义日期选择（日历） -->
    <div class="calendar" id="calendar">
      <div class="cal-head">
        <button class="cal-clear" id="calClear">清除</button>
        <span id="calTitle">2026年8月</span>
        <button class="cal-nav" id="calPrev">◀</button>
        <button class="cal-nav" id="calNext">▶</button>
      </div>
      <div class="cal-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <div class="list" id="list"></div>
    <div class="empty" id="empty">这一页还没字，点右上角 ＋ 记一笔</div>
  </div>

  <!-- 贴边模式的小把手（平时只露出屏幕边缘一小块） -->
  <div class="edge-tab" id="edgeTab"></div>

  <!-- ⋯ 菜单 -->
  <div class="menu" id="menu">
    <div class="menu-item" id="mMode"><span class="mi-ico">▣</span>边框模式<small id="modeState">关</small></div>
    <div class="menu-item" id="mLogin"><span class="mi-ico">◉</span>开机自启<small id="loginState">关</small></div>
    <div class="menu-item" id="mQuit"><span class="mi-ico">⏻</span>退出</div>
    <div class="menu-hint">
      <div class="k">Ctrl+Shift+D　记一笔</div>
      <div class="k">Ctrl+Shift+H　隐藏 / 显示</div>
    </div>
  </div>

<script src="renderer.js"></script>
</body>
</html>
